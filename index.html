function pauses(){ return (state&&state.settings&&state.settings.pauses)||[]; }
function isPaused(d){ const k=iso(d); return pauses().some(p=>k>=p.from&&k<=p.to); }
function pausedBefore(k){ let n=0; pauses().forEach(p=>{ const a=p.from>"2026-11-02"?p.from:"2026-11-02"; if(a>p.to) return; const end=p.to<k?p.to:null; if(!end) { if(a<k) n+=Math.round((new Date(k+"T12:00:00")-new Date(a+"T12:00:00"))/864e5); return; } n+=Math.round((new Date(end+"T12:00:00")-new Date(a+"T12:00:00"))/864e5)+1; }); return n; }
function weekOf(d){ const t=new Date(d.getFullYear(),d.getMonth(),d.getDate()); let diff=Math.floor((t-START)/864e5); if(diff<0) return 0; diff-=pausedBefore(iso(t)); if(diff<0) diff=0; const w=Math.floor(diff/7)+1; return w>12?13:w; }

const XPK={code:30,ml:25,proj:25,fri:25,gym:10,home:5,journal:5,art:10,paint:10,content:10,income:10,life:0,office:0,sleep:0};
function dayStats(d){ const list=sessionsFor(d); const k=iso(d); let xp=0,done=0,todo=0; const must={home:false,code:false,journal:false};
  list.forEach((s,i)=>{ if(s.kind==="sleep"||s.kind==="office") return; todo++; if(state.done[k+":"+i]){ done++; xp+=XPK[s.kind]||0; if(s.kind in must) must[s.kind]=true; } });
  const hasCode=list.some(s=>s.kind==="code"); if(!hasCode) must.code=true;
  return {xp,done,todo,must,core:must.home&&must.code&&must.journal,any:list.length>0};
}
function streak(){ const now=new Date(); let d=new Date(now.getFullYear(),now.getMonth(),now.getDate()); let n=0; const first=new Date(2026,10,1);
  const t=dayStats(d); if(!t.core){ d.setDate(d.getDate()-1); } // today not yet done: count up to yesterday
  while(d>=first){ const s=dayStats(d); if(!s.any){ d.setDate(d.getDate()-1); continue; } if(s.core){ n++; d.setDate(d.getDate()-1); } else break; }
  return {n,todayDone:t.core};
}
function weekStats(d){ const dow=(d.getDay()+6)%7; const mon=new Date(d.getFullYear(),d.getMonth(),d.getDate()-dow); let xp=0,done=0,todo=0,days=0; for(let i=0;i<7;i++){ const x=new Date(mon); x.setDate(mon.getDate()+i); const s=dayStats(x); xp+=s.xp; done+=s.done; todo+=s.todo; if(s.core) days++; } return {xp,done,todo,days,pct:todo?Math.round(done/todo*100):0}; }

let audioCtx=null; const players={}; let audioUnlocked=false;
function player(k){ if(!players[k]){ const a=new Audio(SND[k]); a.preload="auto"; a.setAttribute("playsinline",""); players[k]=a; } return players[k]; }
function unlockAudio(){ try{ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==="suspended") audioCtx.resume(); }catch(e){}
  if(!audioUnlocked){ audioUnlocked=true; Object.keys(SND).forEach(k=>{ const a=player(k); a.muted=true; const p=a.play(); if(p&&p.then) p.then(()=>{a.pause();a.currentTime=0;a.muted=false;}).catch(()=>{a.muted=false;}); }); } }
function playClip(k,fallback){ if(!state.settings.sound) return; try{ const a=player(k); a.muted=false; a.currentTime=0; const p=a.play(); if(p&&p.catch) p.catch(()=>fallback&&fallback()); }catch(e){ fallback&&fallback(); } }
function tone(notes,gain){ if(!state.settings.sound) return; try{ unlockAudio(); if(!audioCtx) return; const t0=audioCtx.currentTime; notes.forEach((f,i)=>{ const o=audioCtx.createOscillator(), g=audioCtx.createGain(); o.type="sine"; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t0+i*0.2); g.gain.exponentialRampToValueAtTime(gain,t0+i*0.2+0.03); g.gain.exponentialRampToValueAtTime(0.0001,t0+i*0.2+0.45); o.connect(g); g.connect(audioCtx.destination); o.start(t0+i*0.2); o.stop(t0+i*0.2+0.5); }); }catch(e){} }
const chime=n=>playClip(n===2?"start":"pre",()=>tone(n===2?[659,784,988,784,988,1175]:[659,988,1319],0.35));
const ding=()=>playClip("ding",()=>tone([880,1109,1319],0.25));
function showBanner(title,text,strong){ const b=document.getElementById("banner"); document.getElementById("bannerTitle").textContent=title; document.getElementById("bannerText").textContent=text; b.classList.add("show"); chime(strong?2:1);
  if(state.settings.notify && "Notification" in window && Notification.permission==="granted"){ try{ new Notification(title,{body:text,tag:"plan-"+Date.now()}); }catch(e){} }
  if(navigator.vibrate) try{navigator.vibrate(strong?[200,100,200]:[150]);}catch(e){} }
document.getElementById("bannerClose").onclick=()=>document.getElementById("banner").classList.remove("show");
const fired=new Set();
function tick(){
  const now=new Date(); const list=sessionsFor(now); const m=now.getHours()*60+now.getMinutes(); const day=iso(now); const pre=state.settings.preMin||10;
  list.forEach((s,i)=>{ const kp=day+":"+i+":pre", ks=day+":"+i+":start";
    if(s.s-m>0 && s.s-m<=pre && !fired.has(kp)){ fired.add(kp); const prev=list.slice(0,i).reverse().find(p=>p.e>m-1); showBanner(s.name+" starts in "+(s.s-m)+" min",(prev?"Wrap up "+prev.name+". ":"")+fmt(s.s)); }
    if(m===s.s && !fired.has(ks)){ fired.add(ks); showBanner(s.name+" starts now", s.detail?s.detail.split("\n")[0]:fmt(s.s)+" to "+fmt(s.e), true); } });
  if(m===21*60 && list.length && !fired.has(day+":risk")){ fired.add(day+":risk"); const st=dayStats(now); if(!st.core){ const left=["home","code","journal"].filter(k=>!st.must[k]).map(k=>({home:"call home",code:"one problem",journal:"journal"})[k]); showBanner("Streak at risk","Still left today: "+left.join(", ")+".",true); } }
  if(cur()==="today") renderNowOnly();
}

/* ---------------- Confetti ---------------- */
function confetti(){ if(window.matchMedia("(prefers-reduced-motion: reduce)").matches) return; const c=document.getElementById("fx"); const ctx=c.getContext("2d"); c.width=innerWidth; c.height=innerHeight; const cols=["#F2A33A","#7BC47F","#E3B75C","#8FB3FF","#ECE6DA"]; const ps=[]; for(let i=0;i<70;i++) ps.push({x:innerWidth/2,y:innerHeight*0.4,vx:(Math.random()-0.5)*14,vy:-Math.random()*12-4,r:Math.random()*5+3,c:cols[i%cols.length],a:1,rot:Math.random()*6});
  let t=0; (function f(){ ctx.clearRect(0,0,c.width,c.height); t++; ps.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.45; p.vx*=0.98; p.a-=0.018; p.rot+=0.1; ctx.save(); ctx.globalAlpha=Math.max(0,p.a); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle=p.c; ctx.fillRect(-p.r,-p.r/2,p.r*2,p.r); ctx.restore(); }); if(t<70) requestAnimationFrame(f); else ctx.clearRect(0,0,c.width,c.height); })(); }

/* ---------------- Plant ---------------- */
function plant(n){ const st=n>=30?5:n>=14?4:n>=7?3:n>=3?2:n>=1?1:0;
  const pot='<path d="M26 78h32l-4 14H30z" fill="var(--live)" opacity=".85"/><rect x="24" y="74" width="36" height="6" rx="2" fill="var(--live)"/>';
  const stem=st>0?'<path d="M42 74 C42 60 42 50 42 '+(74-10*st)+'" stroke="var(--done)" stroke-width="3" fill="none" stroke-linecap="round"/>':'<circle cx="42" cy="72" r="2.5" fill="var(--done)"/>';
  const leaf=(x,y,f)=>'<path d="M'+x+' '+y+' q'+(f?12:-12)+' -6 '+(f?16:-16)+' 4 q-10 6 -16 -4z" fill="var(--done)"/>';
  let leaves=""; if(st>=1) leaves+=leaf(42,66,true); if(st>=2) leaves+=leaf(42,58,false); if(st>=3) leaves+=leaf(42,50,true); if(st>=4) leaves+=leaf(42,42,false); if(st>=5) leaves+='<circle cx="42" cy="22" r="7" fill="var(--gold)"/><circle cx="42" cy="22" r="3" fill="var(--live)"/>';
  return '<svg viewBox="0 0 84 96" aria-hidden="true">'+stem+leaves+pot+'</svg>'; }

/* ---------------- Views ---------------- */
let selDay=null, linkTab="problems", probWeek=0;
function cur(){ return location.hash.replace("#","")||"today"; }
function setNav(){ document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.v===cur())); }
function render(){ setNav(); const v=cur(); const el=document.getElementById("view");
  el.innerHTML = v==="week"?viewWeek(): v==="plan"?viewPlan(): v==="links"?viewLinks(): v==="setup"?viewSetup(): viewToday(); bind(); }
function status(d){ const w=weekOf(d);
  if(isPaused(d)){ const p=pauses().find(p=>iso(d)>=p.from&&iso(d)<=p.to); const back=new Date(p.to+"T12:00:00"); back.setDate(back.getDate()+1); return "Paused"+(p.why?" ("+p.why+")":"")+". Back "+back.toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"}); }
  if(iso(d)==="2026-11-01") return "Day 1, kickoff Sunday";
  if(w===0){ const days=Math.ceil((new Date(2026,10,1)-d)/864e5); return "Starts Sun Nov 1 ("+days+" day"+(days===1?"":"s")+")"; }
  if(w===13) return "Plan ended"; return "Week "+w+" of 12"+(w===1?" (ramp)":"")+(w===4||w===7?" (light)":""); }
function renderNowOnly(){ const n=document.getElementById("nowCard"); if(n&&!document.activeElement.classList.contains("note")){ n.outerHTML=nowCard(new Date()); bind(); } }
function clockStr(mins){ const t=Math.max(0,Math.round(mins*60)); const h=Math.floor(t/3600), mm=Math.floor(t%3600/60), ss=t%60; return (h?h+":"+String(mm).padStart(2,"0"):mm)+":"+String(ss).padStart(2,"0"); }
function hero(now){ const s=streak(); const st=dayStats(now); const pct=st.todo?Math.round(st.done/st.todo*100):0; const r=26, c=2*Math.PI*r;
  const left=["home","code","journal"].filter(k=>!st.must[k]).map(k=>({home:"call home",code:"one problem",journal:"journal"})[k]);
  return '<section class="hero"><div><div class="streak">'+s.n+'<small>day streak'+(s.todayDone?", today counted":"")+'</small></div><div class="sub">'+(st.any?(s.todayDone?"Streak safe. Everything else is bonus.":left.length?"To keep the streak: "+left.join(", "):"Keep going"):"Rest day; streak holds")+'</div></div>'+
   '<div class="ring"><svg width="64" height="64" viewBox="0 0 64 64"><circle cx="32" cy="32" r="'+r+'" stroke="var(--surface2)" stroke-width="7" fill="none"/><circle cx="32" cy="32" r="'+r+'" stroke="var(--done)" stroke-width="7" fill="none" stroke-linecap="round" stroke-dasharray="'+c+'" stroke-dashoffset="'+(c*(1-pct/100))+'"/></svg><div class="pct">'+pct+'%</div></div></section>'; }
function noteBox(key,open){ const v=state.notes[key]||""; if(!v&&!open) return '<button class="notebtn" data-note="'+key+'">Add note</button>'; return '<textarea class="note" data-notekey="'+key+'" placeholder="What did you do, what broke, what next">'+esc(v)+'</textarea>'; }
function nowCard(now){
  const list=sessionsFor(now); const m=now.getHours()*60+now.getMinutes()+now.getSeconds()/60; const w=Math.max(1,Math.min(12,weekOf(now)));
  let ci=list.findIndex(s=>m>=s.s&&m<s.e); let html='<section class="card now" id="nowCard">';
  if(!list.length){ return html+'<div class="label">'+status(now)+'</div><div class="title">'+(isPaused(now)?'Paused':'Rest day')+'</div><div class="detail">'+(isPaused(now)?'No sessions, no alerts, streak holds. The plan picks up exactly where you left it; week dates have shifted to match.':'Nothing scheduled today. Week and Plan show what is coming.')+'</div></section>'; }
  if(ci===-1){ const nx=list.find(s=>s.s>m); if(nx){ html+='<div class="label">Free until '+fmt(nx.s)+'</div><div class="title">Nothing scheduled</div><div class="clock">'+clockStr(nx.s-m)+'<small>until '+esc(nx.name)+'</small></div>'; } else html+='<div class="label">Day done</div><div class="title">Sleep</div>'; return html+'</section>'; }
  const s=list[ci]; const left=s.e-m; const pct=Math.min(100,Math.max(0,(m-s.s)/(s.e-s.s)*100)); const key=iso(now)+":"+ci; const done=!!state.done[key]; const nx=list[ci+1]; const vid=videoFor(s,w);
  html+='<div class="label">Now, '+fmt(s.s)+' to '+fmt(s.e)+'</div><div class="title">'+esc(s.name)+'</div>'+(s.detail?'<div class="detail">'+esc(s.detail)+'</div>':'');
  if(s.kind!=="sleep") html+='<div class="clock">'+clockStr(left)+'<small>left</small></div><div class="bar"><i style="width:'+pct.toFixed(1)+'%"></i></div>';
  if(s.kind!=="sleep"&&s.kind!=="office"){ html+='<div class="btns"><button class="btn '+(done?'sec':'live')+'" data-done="'+key+'">'+(done?'Done':'Mark done')+'</button>'+(s.kind==="code"?'<a class="btn sec" href="#links">Problems</a>':'')+(vid?'<a class="btn sec" href="'+vid[1]+'" target="_blank" rel="noopener">&#9654; '+esc(vid[0])+'</a>':'')+'</div>'+noteBox(key,false); }
  if(nx) html+='<div class="next"><span>Next <b>'+esc(nx.name)+'</b> at '+fmt(nx.s)+'</span><span class="pill">in '+Math.max(0,Math.round(nx.s-m))+' min</span></div>';
  return html+'</section>'; }
function dayList(d){ const list=sessionsFor(d); if(!list.length) return '<p class="muted">Nothing scheduled.</p>';
  const now=new Date(); const sameDay=iso(d)===iso(now); const m=now.getHours()*60+now.getMinutes(); const w=Math.max(1,Math.min(12,weekOf(d)));
  return '<section class="card">'+list.map((s,i)=>{ const key=iso(d)+":"+i; const done=!!state.done[key]; const cls=sameDay?(m>=s.s&&m<s.e?"cur":(m>=s.e?"past":"")):""; const vid=videoFor(s,w); const checkable=s.kind!=="sleep"&&s.kind!=="office";
    return '<div class="row '+cls+'"><div class="t"><b>'+fmt(s.s)+'</b>'+(s.kind==="sleep"?'':'to '+fmt(s.e))+'</div><div class="n"><b>'+esc(s.name)+'</b>'+(s.detail?'<small>'+esc(s.detail)+'</small>':'')+(vid?'<a class="vid" href="'+vid[1]+'" target="_blank" rel="noopener">&#9654; '+esc(vid[0])+'</a>':'')+(checkable?'<div>'+noteBox(key,false)+'</div>':'')+'</div>'+(checkable?'<button class="chk" role="checkbox" aria-checked="'+done+'" aria-label="Done: '+esc(s.name)+'" data-done="'+key+'">'+(done?'&#10003;':'')+'</button>':'')+'</div>'; }).join("")+'</section>'; }
function viewToday(){ const now=new Date(); document.getElementById("h1s").textContent=status(now); const st=dayStats(now); const ws=weekStats(now); const sk=streak();
  return hero(now)+nowCard(now)+'<h2>'+DAYN[now.getDay()]+' '+now.toLocaleDateString(undefined,{month:"short",day:"numeric"})+(st.any?' <span class="pill '+(st.done===st.todo&&st.todo?'ok':'')+'">'+st.done+' of '+st.todo+'</span>':'')+'</h2>'+dayList(now)+
  '<section class="card"><div class="plant">'+plant(sk.n)+'<div><b>This week</b><div class="xp"><div><b>'+ws.xp+'</b><span>XP</span></div><div><b>'+ws.pct+'%</b><span>sessions done</span></div><div><b>'+ws.days+'</b><span>streak days</span></div></div><p class="muted" style="margin:8px 0 0">'+(ws.pct>=80?"Over 80%: chest earned on Sunday.":"80% by Sunday earns the weekly chest.")+' The plant grows with the streak: 3, 7, 14 and 30 days.</p></div></div></section>'+notifHint(); }
function notifHint(){ const perm=("Notification" in window)?Notification.permission:"unsupported"; if(perm==="granted"&&audioCtx) return "";
  return '<section class="card"><b>Alerts</b><p class="muted" style="margin:6px 0 0">Sound and banners work while this page is open. '+(perm==="granted"?"":"Allow notifications in Setup so alerts also show when another app is in front. ")+'For alarms when the page is closed, add the calendar file (see Setup).</p><div class="btns"><button class="btn sec" id="unlock">Enable sound</button><a class="btn sec" href="#setup">Setup</a></div></section>'; }
function viewWeek(){ const now=new Date(); if(!selDay) selDay=iso(now); const d=new Date(selDay+"T12:00:00"); const dow=(d.getDay()+6)%7; const mon=new Date(d); mon.setDate(d.getDate()-dow); document.getElementById("h1s").textContent=status(d); const ws=weekStats(d);
  let html='<div class="wk">'; for(let i=0;i<7;i++){ const x=new Date(mon); x.setDate(mon.getDate()+i); const k=iso(x); const core=dayStats(x).core; html+='<button data-day="'+k+'" class="'+(k===selDay?'on ':'')+(k===iso(now)?'today':'')+'"><b>'+x.getDate()+'</b>'+DAYN[x.getDay()]+(core?'<i></i>':'')+'</button>'; } html+='</div>';
  html+='<div class="btns" style="margin:0 0 10px"><button class="btn sec" data-shift="-7">Previous week</button><button class="btn sec" data-shift="7">Next week</button><span class="pill" style="align-self:center">'+ws.xp+' XP, '+ws.pct+'%</span></div>';
  return html+dayList(d); }
let ttTab="wd";
function viewTimetable(){ const w=Math.max(2,Math.min(12,weekOf(new Date())));
  const sets={wd:["Weekday",weekdaySessions(w,1)],ramp:["Week 1 weekday",weekdaySessions(1,1)],sat:["Saturday",satSessions(w)],sun:["Sunday",sunSessions(w)]};
  const tabs=Object.keys(sets).map(k=>'<button data-tt="'+k+'" class="'+(ttTab===k?'on':'')+'">'+sets[k][0]+'</button>').join("");
  const list=sets[ttTab][1];
  const rows=list.map(s=>'<div class="row"><div class="t"><b>'+fmt(s.s)+'</b>'+(s.kind==="sleep"?'':'to '+fmt(s.e))+'</div><div class="n"><b>'+esc(s.name)+'</b>'+(ttTab==="wd"&&s.kind==="gym"?'<small>Mon, Wed, Fri gym; Tue, Thu cleaning and errands</small>':ttTab==="wd"&&(s.kind==="ml"||s.kind==="proj"||s.kind==="fri")?'<small>Mon, Tue: ML and GPU. Wed, Thu: project. Fri: applications and outreach</small>':'')+'</div></div>').join("");
  return '<h2 style="margin-top:0">Fixed timetable</h2><div class="tabs">'+tabs+'</div><section class="card">'+rows+'</section><p class="muted">The content of each block changes by week (below). The times do not. Study: about 23 hours a week. Creative and side income: about 5.5.</p>'; }
function viewPlan(){ const now=new Date(); const w=weekOf(now); document.getElementById("h1s").textContent="Timetable and 12 weeks";
  return viewTimetable()+'<h2>Week by week</h2>'+WEEKS.map(W=>'<section class="card" '+(W.w===w?'style="border-color:var(--live)"':'')+'><b>Week '+W.w+', '+W.d+'</b>'+(W.w===w?' <span class="pill warn">this week</span>':'')+'<ul><li>Mornings: '+esc(W.code)+'</li><li>Mon/Tue and Sun: '+esc(W.ml)+'</li><li>Wed/Thu and weekend: '+esc(W.proj)+'</li><li>Friday: '+esc(W.fri)+'</li><li>Art: '+esc(ART[W.w-1])+'. Sunday: '+esc(ARTSUN[W.w-1])+'</li></ul></section>').join(""); }
function viewLinks(){ const now=new Date(); const w=Math.min(12,Math.max(1,weekOf(now))); document.getElementById("h1s").textContent="Resources";
  const tabs=[["problems","Problems"],["coding","Coding"],["ml","ML"],["gpu","GPU / NVIDIA"],["papers","Papers"],["jobs","Jobs"],["art","Art"],["income","Income"]];
  let html='<div class="tabs">'+tabs.map(t=>'<button data-tab="'+t[0]+'" class="'+(linkTab===t[0]?'on':'')+'">'+t[1]+'</button>').join("")+'</div>';
  if(linkTab==="problems"){ const tot=PROBLEMS.length, dn=PROBLEMS.filter(p=>state.problems[p[3]]).length; const pw=probWeek||w;
    html+='<p class="muted">'+dn+' of '+tot+' done. Week '+pw+'. <span class="pill">'+Math.round(dn/tot*100)+'%</span></p><div class="tabs">'+[1,2,3,4,5,6,8,9,10,11,12].map(k=>'<button data-pw="'+k+'" class="'+(pw===k?'on':'')+'">'+k+'</button>').join("")+'</div><section class="card">';
    html+=PROBLEMS.filter(p=>p[0]===pw).map(p=>{ const d=!!state.problems[p[3]]; return '<div class="prob"><button class="chk" role="checkbox" aria-checked="'+d+'" aria-label="Done: '+esc(p[1])+'" data-prob="'+p[3]+'">'+(d?'&#10003;':'')+'</button><span class="lv">'+p[2]+'</span><span class="nm">'+esc(p[1])+'</span><a href="https://leetcode.com/problems/'+p[3]+'/" target="_blank" rel="noopener">Solve</a><a href="'+YT("NeetCode "+p[1])+'" target="_blank" rel="noopener">Video</a></div>'; }).join("")||'<p class="muted">Review week: redo the 3 hardest so far.</p>'; html+='</section>'; }
  else html+='<section class="card">'+LINKS[linkTab].map(l=>'<div class="prob"><span class="nm">'+esc(l[0])+'</span><a href="'+l[1]+'" target="_blank" rel="noopener">Open</a></div>').join("")+'</section>';
  return html; }
function viewSetup(){ document.getElementById("h1s").textContent="Setup"; const perm=("Notification" in window)?Notification.permission:"unsupported"; const st=state.settings; const standalone=window.matchMedia("(display-mode: standalone)").matches||navigator.standalone;
  return '<section class="card"><b>Alerts</b><div class="kv" style="margin-top:8px"><span>Sound</span><button class="btn sec" id="tSound">'+(st.sound?'On':'Off')+'</button><span>Banner before a session</span><button class="btn sec" id="tPre">'+st.preMin+' min</button><span>System notifications</span>'+(perm==="granted"?'<span class="pill ok">allowed</span>':perm==="denied"?'<span class="pill warn">blocked in browser settings</span>':perm==="unsupported"?'<span class="pill warn">not on this browser</span>':'<button class="btn" id="askNotif">Allow</button>')+'</div><div class="btns"><button class="btn sec" id="testAlert">Test alert</button></div>'+
   '<p class="muted" style="margin:10px 0 0">No sound on iPhone? Check the ring/silent switch (no orange showing), media volume up, and tap Enable sound once after opening. The chime plays as media, so it should also work on silent after this update. On Mac, Chrome or Safari show notifications once allowed while the tab is open. On iPhone and iPad, Safari shows notifications only from a page added to the Home Screen (Share, then Add to Home Screen). '+(standalone?'You are in the Home Screen app now.':'You are in a browser tab now.')+'</p></section>'+
   '<section class="card"><b>Alarms when the page is closed</b><p class="muted" style="margin:6px 0 0">Import plan-alarms.ics into Apple Calendar on one device. Every session gets a 10-minute alert with sound on iPhone, iPad and Mac. This page is for the countdown, the detail, notes and streak.</p></section>'+
   '<section class="card"><b>Streak rule</b><p class="muted" style="margin:6px 0 0">A day counts when three things are done: call home, the coding session, journal. Rest days (before Nov 1, after Jan 24) do not break it. A 9 pm alert fires if any of the three is still open.</p></section>'+
   '<section class="card"><b>Pause the plan</b><p class="muted" style="margin:6px 0 0">Paused days have no sessions and no alerts, the streak holds, and every later week shifts by the paused days so nothing is skipped.</p>'+(pauses().map((p,i)=>'<div class="kv" style="margin-top:8px"><span>'+p.from+' to '+p.to+(p.why?' ('+esc(p.why)+')':'')+'</span><button class="btn sec" data-unpause="'+i+'">Remove</button></div>').join("")||'<p class="muted">No pauses.</p>')+'<div class="btns" style="align-items:center"><input type="date" id="pFrom" class="note" style="width:auto;margin:0"><input type="date" id="pTo" class="note" style="width:auto;margin:0"><input type="text" id="pWhy" class="note" placeholder="Reason" style="width:110px;margin:0;min-height:0"><button class="btn" id="addPause">Add pause</button></div></section>'+
   '<section class="card"><b>Sync</b><p class="muted" style="margin:6px 0 0">'+(docRef?'Checkmarks and notes sync across your devices through your Claude account.':'Saved on this device only. Open the page through claude.ai while signed in to sync.')+'</p></section>'+
   '<section class="card"><b>Appearance</b><div class="btns"><button class="btn sec" data-theme="dark">Night desk (dark)</button><button class="btn sec" data-theme="light">Light</button><button class="btn sec" data-theme="">Follow device</button></div></section>'+
   '<section class="card"><b>Reset</b><div class="btns"><button class="btn sec" id="reset">Clear all progress</button></div></section>'; }
function esc(s){ return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

/* ---------------- Events ---------------- */
function bind(){
  document.querySelectorAll("[data-done]").forEach(b=>b.onclick=()=>{ unlockAudio(); const k=b.dataset.done; const was=!!state.done[k]; if(was) delete state.done[k]; else state.done[k]=true; persist(); if(!was){ ding(); const st=dayStats(new Date()); if(st.core&&k.startsWith(iso(new Date()))){ const sk=streak(); if(sk.todayDone) confetti(); } } render(); });
  document.querySelectorAll("[data-prob]").forEach(b=>b.onclick=()=>{ const k=b.dataset.prob; const was=!!state.problems[k]; if(was) delete state.problems[k]; else { state.problems[k]=true; ding(); } persist(); render(); });
  document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{ selDay=b.dataset.day; render(); });
  document.querySelectorAll("[data-shift]").forEach(b=>b.onclick=()=>{ const d=new Date(selDay+"T12:00:00"); d.setDate(d.getDate()+Number(b.dataset.shift)); selDay=iso(d); render(); });
  document.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>{ linkTab=b.dataset.tab; render(); });
  document.querySelectorAll("[data-tt]").forEach(b=>b.onclick=()=>{ ttTab=b.dataset.tt; render(); });
  document.querySelectorAll("[data-pw]").forEach(b=>b.onclick=()=>{ probWeek=Number(b.dataset.pw); render(); });
  document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{ const t=b.dataset.theme; if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); try{localStorage.setItem("plan-theme",t);}catch(e){} });
  document.querySelectorAll("[data-note]").forEach(b=>b.onclick=()=>{ b.outerHTML=noteBox(b.dataset.note,true); bind(); const ta=document.querySelector('textarea[data-notekey="'+b.dataset.note+'"]'); if(ta) ta.focus(); });
  document.querySelectorAll("textarea[data-notekey]").forEach(t=>{ t.oninput=()=>{ state.notes[t.dataset.notekey]=t.value; persist(); }; });
  const u=document.getElementById("unlock"); if(u) u.onclick=()=>{ unlockAudio(); chime(1); render(); };
  const ts=document.getElementById("tSound"); if(ts) ts.onclick=()=>{ state.settings.sound=!state.settings.sound; unlockAudio(); persist(); render(); };
  const tp=document.getElementById("tPre"); if(tp) tp.onclick=()=>{ const o=[5,10,15]; state.settings.preMin=o[(o.indexOf(state.settings.preMin)+1)%o.length]; persist(); render(); };
  const an=document.getElementById("askNotif"); if(an) an.onclick=async()=>{ unlockAudio(); try{ await Notification.requestPermission(); }catch(e){} render(); };
  const ta=document.getElementById("testAlert"); if(ta) ta.onclick=()=>{ unlockAudio(); showBanner("Coding starts in 10 min","Wrap up Breakfast. This is a test.",true); confetti(); };
  document.querySelectorAll("[data-unpause]").forEach(b=>b.onclick=()=>{ state.settings.pauses.splice(Number(b.dataset.unpause),1); persist(); render(); });
  const ap=document.getElementById("addPause"); if(ap) ap.onclick=()=>{ const f=document.getElementById("pFrom").value, t=document.getElementById("pTo").value, w=document.getElementById("pWhy").value.trim(); if(!f||!t||t<f){ alert("Pick a start and an end date."); return; } if(!state.settings.pauses) state.settings.pauses=[]; state.settings.pauses.push({from:f,to:t,why:w}); state.settings.pauses.sort((a,b)=>a.from<b.from?-1:1); persist(); render(); };
  const rs=document.getElementById("reset"); if(rs) rs.onclick=()=>{ if(confirm("Clear all checkmarks and notes?")){ state.done={}; state.problems={}; state.notes={}; persist(); render(); } };
}
window.addEventListener("hashchange",render);
document.addEventListener("click",unlockAudio,{once:true});
document.addEventListener("touchstart",unlockAudio,{once:true});
try{ const t=localStorage.getItem("plan-theme"); if(t===""||t==="light") { if(t) document.documentElement.setAttribute("data-theme",t); else document.documentElement.removeAttribute("data-theme"); } }catch(e){}
loadLocal(); render(); setInterval(tick,1000); tick();
if(window.claude&&window.claude.use) initDb();
</script>
